<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>小羊过河</title>
<style>
  :root {
    --glass: rgba(14, 18, 22, .42);
    --line: rgba(255, 255, 255, .14);
    --text: #f2eee6;
    --muted: rgba(242, 238, 230, .62);
    --accent: #d8b27a;
    --serif: "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", "SimSun", serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #1a1f24; color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: none; -webkit-tap-highlight-color: transparent;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background: radial-gradient(ellipse at 50% 55%, transparent 55%, rgba(0,0,0,.38) 100%);
  }

  /* ---------- 顶部信息 ---------- */
  #hud {
    position: fixed; top: 0; left: 0; right: 0; z-index: 2; pointer-events: none;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
    padding: calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 14px) 0 calc(env(safe-area-inset-left) + 14px);
  }
  .panel {
    background: var(--glass); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px;
    backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
  }
  .eyebrow { font-size: 10.5px; letter-spacing: .18em; color: var(--muted); text-transform: uppercase; font-weight: 600; }
  #lvName { font-family: var(--serif); font-size: 17px; margin-top: 3px; letter-spacing: .06em; white-space: nowrap; }
  .timer { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .bar { width: 120px; height: 3px; background: rgba(255,255,255,.15); border-radius: 2px; overflow: hidden; }
  #timeFill { height: 100%; width: 100%; background: var(--accent); transition: width .25s linear, background .3s; }
  #timeFill.low { background: #e07a5f; }
  #timeNum { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 26px; }
  .right { display: flex; align-items: center; gap: 16px; }
  .num { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; margin-top: 2px; }
  .lives { display: flex; gap: 5px; margin-top: 8px; }
  .lives i { width: 8px; height: 8px; border-radius: 50%; background: var(--text); }
  .lives i.off { background: transparent; border: 1px solid rgba(255,255,255,.35); }
  .iconBtn {
    pointer-events: auto; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; padding: 0;
    border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--text);
    display: grid; place-items: center; transition: background .2s;
  }
  .iconBtn:hover { background: rgba(255,255,255,.16); }
  .iconBtn svg { width: 16px; height: 16px; }
  .btns { display: flex; gap: 6px; }

  /* ---------- 键位提示（电脑） ---------- */
  #hint {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 18px); transform: translateX(-50%); z-index: 2;
    font-size: 12px; color: var(--muted); letter-spacing: .06em; white-space: nowrap; pointer-events: none;
    background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: opacity .6s;
  }
  kbd {
    display: inline-block; min-width: 22px; padding: 2px 6px; margin: 0 2px; text-align: center;
    border: 1px solid rgba(255,255,255,.3); border-bottom-width: 2px; border-radius: 5px;
    font-family: inherit; font-size: 11px; color: var(--text);
  }

  /* ---------- 手机操作 ---------- */
  #touch { display: none; }
  @media (pointer: coarse) { #touch { display: block; } #hint { display: none; } }
  #dpad { position: fixed; z-index: 3; left: calc(env(safe-area-inset-left) + 16px); bottom: calc(env(safe-area-inset-bottom) + 16px); width: 156px; height: 156px; }
  #dpad button {
    position: absolute; width: 52px; height: 52px; border-radius: 50%; padding: 0; touch-action: none;
    background: var(--glass); border: 1px solid var(--line); color: var(--text); display: grid; place-items: center;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: background .15s, border-color .15s;
  }
  #dpad button.on { border-color: var(--accent); color: var(--accent); }
  #dpad button:active { background: rgba(255,255,255,.2); }
  #dpad svg { width: 18px; height: 18px; }
  #tUp { left: 52px; top: 0; } #tLeft { left: 0; top: 52px; } #tRight { left: 104px; top: 52px; } #tDown { left: 52px; top: 104px; }
  #jumpBtn {
    position: fixed; z-index: 3; right: calc(env(safe-area-inset-right) + 20px); bottom: calc(env(safe-area-inset-bottom) + 34px);
    width: 88px; height: 88px; border-radius: 50%; border: none; touch-action: none;
    background: rgba(216,178,122,.9); color: #1b1712; font-size: 15px; font-weight: 600; letter-spacing: .2em; text-indent: .2em;
    box-shadow: 0 8px 24px rgba(0,0,0,.3);
  }
  #jumpBtn:active { transform: scale(.94); background: #e6c391; }

  /* ---------- 提示文字 ---------- */
  #toast {
    position: fixed; top: 34%; left: 50%; transform: translate(-50%,-50%); z-index: 4; pointer-events: none; text-align: center;
    font-family: var(--serif); font-size: 28px; letter-spacing: .18em; white-space: nowrap;
    text-shadow: 0 2px 18px rgba(0,0,0,.55); opacity: 0; transition: opacity .4s;
  }
  #toast small { display: block; font-size: 11px; letter-spacing: .3em; color: var(--muted); margin-bottom: 8px; font-family: -apple-system, "PingFang SC", sans-serif; text-transform: uppercase; }
  #toast.show { opacity: 1; }

  /* ---------- 弹窗 ---------- */
  #overlay {
    position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; padding: 24px;
    background: radial-gradient(ellipse at center, rgba(10,14,18,.3), rgba(10,14,18,.78));
    backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); transition: opacity .4s;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  .sheet { max-width: 440px; width: 100%; text-align: center; max-height: 100%; overflow: auto; }
  .sheet h1 { font-family: var(--serif); font-weight: 600; font-size: 46px; letter-spacing: .16em; text-indent: .16em; margin: 10px 0 4px; }
  .divider { width: 36px; height: 1px; background: var(--accent); margin: 16px auto; }
  .sub { color: var(--muted); font-size: 14px; line-height: 1.9; margin: 0; }
  .keys { display: flex; justify-content: center; gap: 22px; margin-top: 22px; flex-wrap: wrap; color: var(--muted); font-size: 12px; letter-spacing: .05em; }
  .stats { margin: 22px auto 0; max-width: 270px; border-top: 1px solid var(--line); }
  .stats div { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; color: var(--muted); }
  .stats b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .stats .total b { color: var(--accent); font-size: 18px; }
  .primary {
    margin-top: 28px; background: var(--accent); color: #1b1712; border: none; border-radius: 999px; cursor: pointer;
    padding: 13px 46px; font-size: 15px; font-weight: 600; letter-spacing: .3em; text-indent: .3em; transition: background .2s, transform .15s;
  }
  .primary:hover { background: #e6c391; }
  .primary:active { transform: scale(.97); }
  .touchOnly { display: none; } .deskOnly { display: inline; }
  @media (pointer: coarse) { .touchOnly { display: inline; } .deskOnly { display: none; } }

  @media (max-width: 480px) {
    .bar { width: 70px; } #lvName { font-size: 15px; }
    .right { gap: 10px; } .panel { padding: 8px 10px; } .iconBtn { width: 30px; height: 30px; }
    .num { font-size: 19px; } .sheet h1 { font-size: 38px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="vignette"></div>

<header id="hud">
  <div class="panel">
    <div class="eyebrow">Level <span id="lvNum">01</span> / <span id="lvTotal">03</span></div>
    <div id="lvName">晨雾 · 小溪</div>
    <div class="timer"><div class="bar"><div id="timeFill"></div></div><span id="timeNum">60</span></div>
  </div>
  <div class="panel right">
    <div><div class="eyebrow">Score</div><div class="num" id="score">0</div></div>
    <div><div class="eyebrow">Lives</div><div class="lives" id="lives"></div></div>
    <div class="btns">
      <button class="iconBtn" id="soundBtn" aria-label="声音">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path id="soundWave" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      </button>
      <button class="iconBtn" id="restartBtn" aria-label="重玩">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      </button>
    </div>
  </div>
</header>

<div id="hint"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 转向 &nbsp;·&nbsp; <kbd>Space</kbd> 跳跃</div>

<div id="touch">
  <div id="dpad">
    <button id="tUp" data-dir="fwd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg></button>
    <button id="tLeft" data-dir="left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></button>
    <button id="tRight" data-dir="right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>
    <button id="tDown" data-dir="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
  </div>
  <button id="jumpBtn">跳</button>
</div>

<div id="toast"></div>
<div id="overlay"><div class="sheet" id="sheet"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =====================================================================
 *  配置区：改这里就能调整关卡和数值，不需要改下面的代码
 * ===================================================================== */
const CONFIG = {
  lives: 3,              // 初始生命
  riverWidth: 9,         // 河面可活动的列数
  jumpTime: 0.22,        // 跳一格用时（秒）
  inputCooldown: 0.12,   // 落地后多久才能再跳（秒），越大越不灵敏
  landTolerance: 0.12,   // 落在木筏边缘的宽容度
  scorePerRow: 10,       // 每前进一排得分
  levelBonus: 200,       // 过关奖励
  timeBonusPerSec: 5,    // 剩余每秒奖励
  levels: [
    // lanes: 河道数  speed: 木筏速度范围  plankLength: 木筏长度范围  gap: 木筏间距范围
    // timeLimit: 限时（秒）  timeOfDay: 光照时段 morning / noon / dusk  safeLanes: 可休息的沙洲（可选）
    { name: "晨雾 · 小溪", timeOfDay: "morning", lanes: 4, speed: [0.7, 1.2], plankLength: [3, 4],     gap: [1.2, 2.2], timeLimit: 60 },
    { name: "午后 · 河湾", timeOfDay: "noon",    lanes: 6, speed: [1.1, 1.8], plankLength: [2.4, 3.4], gap: [1.8, 2.8], timeLimit: 60 },
    { name: "黄昏 · 急流", timeOfDay: "dusk",    lanes: 8, speed: [1.5, 2.4], plankLength: [2.0, 2.8], gap: [2.2, 3.2], timeLimit: 75, safeLanes: [4] }
  ],
  // 三种时段的光照和配色
  atmosphere: {
    morning: { skyTop: 0x86a9cf, horizon: 0xdcd6c8, sun: 0xffe2bd, sunIntensity: 2.4, sunDir: [-0.45, 0.42, -0.78],
               hemiSky: 0xcfdcea, hemiGround: 0x4a5238, hemiIntensity: 0.85, waterDeep: 0x123a40, waterShallow: 0x3a6f64, exposure: 0.95 },
    noon:    { skyTop: 0x5a8fcb, horizon: 0xc6d7e2, sun: 0xfff2dc, sunIntensity: 2.8, sunDir: [0.35, 0.75, -0.55],
               hemiSky: 0xd2e3f3, hemiGround: 0x4f5c3a, hemiIntensity: 0.9, waterDeep: 0x0f3d4a, waterShallow: 0x2c7472, exposure: 0.88 },
    dusk:    { skyTop: 0x34436a, horizon: 0xe39a68, sun: 0xffa45c, sunIntensity: 2.6, sunDir: [0.5, 0.2, -0.84],
               hemiSky: 0x8f8db0, hemiGround: 0x46362c, hemiIntensity: 0.7, waterDeep: 0x162a38, waterShallow: 0x4b5658, exposure: 1.0 }
  }
};

/* =====================================================================
 *  以下为游戏代码
 * ===================================================================== */
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = v => Array.isArray(v) ? rand(v[0], v[1]) : v;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const wrap = (v, P) => ((v + P / 2) % P + P) % P - P / 2;
const deg = d => d * Math.PI / 180;
const SIDE = 12;            // 屏幕两侧额外的河面长度，木筏在这里"绕回来"
const WATER_Y = -0.18;      // 水面高度

/* ---------- 声音（全部用代码合成，不需要音频文件） ---------- */
let actx = null, master = null, riverGain = null, muted = false;
function audio() {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    master = actx.createGain(); master.gain.value = muted ? 0 : 1; master.connect(actx.destination);
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function noiseBuffer(sec, brown) {
  const ctx = audio(), n = Math.floor(ctx.sampleRate * sec), buf = ctx.createBuffer(1, n, ctx.sampleRate), d = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < n; i++) {
    const w = Math.random() * 2 - 1;
    if (brown) { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; } else d[i] = w;
  }
  return buf;
}
function noiseHit(dur, type, freq, vol, q = 0.8) {
  const ctx = audio(); if (!ctx) return;
  const src = ctx.createBufferSource(); src.buffer = noiseBuffer(dur, false);
  const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = ctx.createGain(), t = ctx.currentTime;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(f); f.connect(g); g.connect(master); src.start();
}
function tone(freq, dur, type = 'sine', vol = 0.08, slide = 0, delay = 0) {
  const ctx = audio(); if (!ctx) return;
  const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + delay;
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
}
const sfx = {
  river() {
    const ctx = audio(); if (!ctx || riverGain) return;
    const src = ctx.createBufferSource(); src.buffer = noiseBuffer(4, true); src.loop = true;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 650;
    riverGain = ctx.createGain(); riverGain.gain.value = 0.05;
    src.connect(lp); lp.connect(riverGain); riverGain.connect(master); src.start();
  },
  turn()   { tone(880, 0.04, 'sine', 0.015); },
  jump()   { tone(300, 0.16, 'sine', 0.05, 160); },
  wood()   { noiseHit(0.12, 'lowpass', 380, 0.22); tone(105, 0.12, 'sine', 0.06, -20); },
  grass()  { noiseHit(0.08, 'bandpass', 2200, 0.05, 0.6); },
  splash() { noiseHit(0.6, 'bandpass', 1100, 0.32, 0.5); noiseHit(0.25, 'lowpass', 300, 0.25); },
  chime()  { [659, 784, 988, 1319].forEach((f, i) => tone(f, 1.2, 'sine', 0.05, 0, i * 0.12)); },
  fail()   { [392, 330, 262].forEach((f, i) => tone(f, 0.7, 'sine', 0.05, 0, i * 0.18)); },
  click()  { tone(660, 0.06, 'sine', 0.04); }
};

/* ---------- 渲染器与场景 ---------- */
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const lin = hex => new THREE.Color(hex).convertSRGBToLinear();   // 把常见的颜色值转成线性空间

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xcccccc, 20, 70);
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 400);

const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 0.8);
scene.add(hemi);
const sunLight = new THREE.DirectionalLight(0xffffff, 2.5);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.bias = -0.0004;
sunLight.shadow.normalBias = 0.02;
Object.assign(sunLight.shadow.camera, { left: -15, right: 15, top: 15, bottom: -15, near: 1, far: 80 });
scene.add(sunLight, sunLight.target);
const sunDir = new THREE.Vector3();

/* ---------- 天空（渐变 + 太阳光晕） ---------- */
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(180, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { topColor: { value: new THREE.Color() }, horizonColor: { value: new THREE.Color() }, sunColor: { value: new THREE.Color() }, sunDir: { value: sunDir } },
    vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      uniform vec3 topColor, horizonColor, sunColor, sunDir; varying vec3 vDir;
      void main(){
        vec3 d = normalize(vDir);
        vec3 col = mix(horizonColor, topColor, pow(clamp(d.y, 0.0, 1.0), 0.55));
        col = mix(col, horizonColor * 0.85, smoothstep(0.0, -0.2, d.y));
        float s = max(dot(d, normalize(sunDir)), 0.0);
        col += sunColor * (pow(s, 900.0) * 8.0 + pow(s, 14.0) * 0.35);
        gl_FragColor = vec4(col, 1.0);
        #include <tonemapping_fragment>
        #include <encodings_fragment>
      }`
  })
);
sky.renderOrder = -1;
scene.add(sky);

/* ---------- 河水（自定义着色器：分道流动的波纹、菲涅尔反射、太阳高光、岸边泡沫） ---------- */
const waterMat = new THREE.ShaderMaterial({
  fog: true,
  uniforms: THREE.UniformsUtils.merge([THREE.UniformsLib.fog, {
    uTime: { value: 0 }, uSunDir: { value: new THREE.Vector3() }, uSunColor: { value: new THREE.Color() },
    uDeep: { value: new THREE.Color() }, uShallow: { value: new THREE.Color() },
    uSkyTop: { value: new THREE.Color() }, uSkyHorizon: { value: new THREE.Color() },
    uLaneSpeed: { value: new Array(16).fill(0) }, uBankNear: { value: -0.5 }, uBankFar: { value: -5.5 }, uPlayHalf: { value: 5 }
  }]),
  vertexShader: `
    uniform float uTime; varying vec3 vWorld;
    #include <fog_pars_vertex>
    void main(){
      vec4 wp = modelMatrix * vec4(position, 1.0);
      wp.y += sin(wp.x * 0.9 + uTime * 1.3) * 0.012 + sin(wp.z * 2.1 - uTime * 1.1) * 0.01;
      vWorld = wp.xyz;
      vec4 mvPosition = viewMatrix * wp;
      gl_Position = projectionMatrix * mvPosition;
      #include <fog_vertex>
    }`,
  fragmentShader: `
    uniform float uTime, uBankNear, uBankFar, uPlayHalf;
    uniform float uLaneSpeed[16];
    uniform vec3 uSunDir, uSunColor, uDeep, uShallow, uSkyTop, uSkyHorizon;
    varying vec3 vWorld;
    #include <fog_pars_fragment>
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float noise(vec2 p){
      vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
    }
    float waves(vec2 p){
      return noise(p * vec2(1.1, 2.6)) * 0.5 + noise(p * vec2(2.6, 4.4) + 3.1) * 0.3 + noise(p * vec2(6.5, 9.0) + 7.7) * 0.15;
    }
    void main(){
      int lane = int(floor(-vWorld.z + 0.5));
      float spd = 0.0;
      for (int i = 0; i < 16; i++) { if (i == lane) spd = uLaneSpeed[i]; }
      vec2 p = vec2(vWorld.x - spd * uTime * 0.9, vWorld.z + uTime * 0.04);

  add(sphere, wool, 0, 0.5, 0, body, [0.27, 0.23, 0.36]);

  add(sphere, face, 0, -0.03, -0.09, head, [0.115, 0.125, 0.19]).rotation.x = 0.35;
  [-1, 1].forEach(s => {
    add(sphere, eye, s * 0.075, 0.03, -0.12, head, [0.022, 0.022, 0.022]);
    const earPivot = new THREE.Group(); earPivot.position.set(s * 0.1, 0.04, -0.02); earPivot.rotation.z = s * -0.35; head.add(earPivot);
    add(sphere, face, s * 0.08, 0, 0, earPivot, [0.09, 0.028, 0.045]);
  });
  for (let i = 0; i < 6; i++) add(woolGeo, wool, rand(-0.06, 0.06), 0.1 + rand(0, 0.03), rand(-0.02, 0.08), head, [0.065, 0.06, 0.065]);

  const legs = [];
  [[0.13, -0.2], [-0.13, -0.2], [0.13, 0.2], [-0.13, 0.2]].forEach(([x, z]) => {

const particles = [], ripples = [];
const dropGeo = new THREE.SphereGeometry(1, 6, 5);
function spray(x, y, z, n, color, opts = {}) {
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(dropGeo, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: opts.opacity || 0.85, depthWrite: false, blending: opts.additive ? THREE.AdditiveBlending : THREE.NormalBlending }));

    particles.push({ m, v: new THREE.Vector3(rand(-sp, sp), rand(up[0], up[1]), rand(-sp, sp)), life: rand(...(opts.life || [0.5, 0.9])), g: opts.gravity ?? 9.8 });
  }
}
function ripple(x, z, delay = 0, size = 1.4) {
  const m = new THREE.Mesh(new THREE.RingGeometry(0.9, 1, 48).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xe8f1f2, transparent: true, opacity: 0, depthWrite: false }));
  m.position.set(x, WATER_Y + 0.02, z); m.scale.setScalar(0.1); scene.add(m);
  ripples.push({ m, t: -delay, size });

function updateEffects(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.v.y -= p.g * dt; p.m.position.addScaledVector(p.v, dt); p.life -= dt;
    p.m.material.opacity = Math.min(p.m.material.opacity, Math.max(0, p.life * 1.5));
    if (p.life <= 0 || (p.g > 0 && p.m.position.y < WATER_Y - 0.1)) { scene.remove(p.m); p.m.material.dispose(); particles.splice(i, 1); }
  }
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i]; r.t += dt;
    if (r.t < 0) continue;
    const k = r.t / 1.1;
    r.m.scale.setScalar(0.1 + k * r.size); r.m.material.opacity = 0.5 * (1 - k);
    if (k >= 1) { scene.remove(r.m); r.m.geometry.dispose(); r.m.material.dispose(); ripples.splice(i, 1); }
  }
}

  sunDir.set(...A.sunDir).normalize();
  sunLight.color.copy(lin(A.sun)); sunLight.intensity = A.sunIntensity;
  hemi.color.copy(lin(A.hemiSky)); hemi.groundColor.copy(lin(A.hemiGround)); hemi.intensity = A.hemiIntensity;
  renderer.toneMappingExposure = A.exposure;
  scene.fog.color.set(A.horizon);
  scene.background = new THREE.Color(A.horizon);
  const su = sky.material.uniforms;
  su.topColor.value.copy(lin(A.skyTop)); su.horizonColor.value.copy(lin(A.horizon)); su.sunColor.value.copy(lin(A.sun));
  const wu = waterMat.uniforms;
  wu.uSunDir.value.copy(sunDir); wu.uSunColor.value.copy(lin(A.sun));
  wu.uDeep.value.copy(lin(A.waterDeep)); wu.uShallow.value.copy(lin(A.waterShallow));
  wu.uSkyTop.value.copy(lin(A.skyTop)); wu.uSkyHorizon.value.copy(lin(A.horizon));
}

/* ---------- 搭建关卡 ---------- */
let rows = [], goalRow = 0;
function buildLevel(i) {
  if (levelGroup) {
    scene.remove(levelGroup);
    levelGroup.traverse(o => { if (o.geometry && !SHARED_GEOS.includes(o.geometry)) o.geometry.dispose(); });
  }
  levelGroup = new THREE.Group(); scene.add(levelGroup);
  const L = CONFIG.levels[i], N = L.lanes, W = CONFIG.riverWidth, half = W / 2, span = W + 2 * SIDE;
  goalRow = N + 1; rows = [];
  applyAtmosphere(L.timeOfDay);

  const farEdge = -(goalRow - 0.5);
  rows[0] = { type: 'land' }; rows[goalRow] = { type: 'land' };
  addBank(-0.5, 16);
  addBank(farEdge - 60, farEdge);

  const rocks = [], tufts = [], reedL = [], tails = [];
  shoreRocks(-0.5, rocks); shoreRocks(farEdge, rocks);
  grassTufts(0.6, 9, 4500, tufts); grassTufts(farEdge - 10, farEdge - 0.6, 3500, tufts);
  reeds(-0.45, half, reedL, tails); reeds(farEdge + 0.05, half, reedL, tails);

  // 沙洲
  for (let r = 1; r <= N; r++) {
    if ((L.safeLanes || []).includes(r)) {
      rows[r] = { type: 'land' };
      const m = new THREE.Mesh(new THREE.BoxGeometry(90, 0.5, 1.0), [dirtMat, dirtMat, sandMat, dirtMat, dirtMat, dirtMat]);
      m.position.set(0, -0.25, -r); m.receiveShadow = true; levelGroup.add(m);
      shoreRocks(-r - 0.5, rocks, 0.6); shoreRocks(-r + 0.5, rocks, 0.6);
    }
  }
  instanced(rockGeo, rockMat, rocks, true);
  instanced(bladeGeo, plainMat, tufts, false);
  instanced(reedGeo, plainMat, reedL, false);
  instanced(cattailGeo, plainMat, tails, false);

  // 树木
  for (let k = 0; k < 16; k++) {
    const side = k % 2 ? 1 : -1;
    const fn = Math.random() < 0.35 ? addPine : addTree;
    fn(side * rand(half + 2.5, half + 14), rand(1.5, 12), rand(0.9, 1.5));
    fn(side * rand(half + 1.5, half + 16), farEdge - rand(1.5, 14), rand(1.0, 1.7));
  }
  addBarn(0, farEdge - 5.2);
  addFence(farEdge - 2.0);
  addHills(farEdge - 34);

  // 边界木桩
  const stakeMat = new THREE.MeshStandardMaterial({ map: woodTexes[1], color: lin(0xb8a48c), roughness: 1 });
  for (let r = 0; r <= N; r++) [-1, 1].forEach(s => {
    const st = addMesh(new THREE.CylinderGeometry(0.05, 0.06, 0.75, 7), stakeMat, s * (half + 0.55), 0.0, -r - 0.5);
    st.rotation.z = rand(-0.08, 0.08);
  });

  // 河道与木筏
  const speeds = new Array(16).fill(0);
  for (let r = 1; r <= N; r++) {
    if (rows[r]) continue;
    const dir = r % 2 ? 1 : -1;
    const speed = pick(L.speed) * dir;
    const rafts = [];
    let x = 0;
    while (x < span) {
      const len = pick(L.plankLength), gap = pick(L.gap);
      rafts.push({ x: x + len / 2, len });
      x += len + gap;
    }
    const period = x, off = rand(0, period);
    rafts.forEach(p => {
      p.x = wrap(p.x + off, period);
      p.phase = rand(0, 6); p.dip = 0; p.dipV = 0;
      p.group = makeRaft(p.len);
      p.group.position.set(p.x, WATER_Y + 0.03, -r);
      levelGroup.add(p.group);
    });
    rows[r] = { type: 'water', speed, rafts, period };
    if (r < 16) speeds[r] = speed;
  }
  const wu = waterMat.uniforms;
  wu.uLaneSpeed.value = speeds; wu.uBankNear.value = -0.5; wu.uBankFar.value = farEdge; wu.uPlayHalf.value = half + 0.6;
}

/* ---------- 游戏状态 ---------- */
const DIRS = { fwd: [0, 1], back: [0, -1], left: [-1, 0], right: [1, 0] };
const ANGLE = { fwd: 0, back: Math.PI, left: Math.PI / 2, right: -Math.PI / 2 };
let state = 'menu', levelIdx = 0, lives = 0, score = 0, timeLeft = 0, bestRow = 0, stateTimer = 0, queued = false, lastLand = -1, elapsed = 0;
const sheep = { row: 0, x: 0, y: 0, z: 0, dir: 'fwd', jumping: false, jt: 0, from: null, to: null, carry: 0, ride: null, raft: null, sinkFrom: 0 };
const LIM = () => Math.floor(CONFIG.riverWidth / 2);

function updateHUD() {
  const L = CONFIG.levels[levelIdx];
  $('lvNum').textContent = String(levelIdx + 1).padStart(2, '0');
  $('lvTotal').textContent = String(CONFIG.levels.length).padStart(2, '0');
  $('lvName').textContent = L.name;
  $('score').textContent = score;
  $('lives').innerHTML = Array.from({ length: CONFIG.lives }, (_, i) => `<i class="${i < lives ? '' : 'off'}"></i>`).join('');
  const t = Math.max(0, timeLeft);
  $('timeNum').textContent = Math.ceil(t);
  $('timeFill').style.width = (t / L.timeLimit * 100) + '%';
  $('timeFill').classList.toggle('low', t < 10);
}
let toastTimer = null;
function toast(msg, sub = '', ms = 1400) {
  $('toast').innerHTML = (sub ? `<small>${sub}</small>` : '') + msg;
  $('toast').classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $('toast').classList.remove('show'), ms);
}
function showOverlay(html, btnText, onClick) {
  $('sheet').innerHTML = html + `<button class="primary" id="ovBtn">${btnText}</button>`;
  $('overlay').classList.remove('hidden');
  $('ovBtn').onclick = () => { $('ovBtn').blur(); sfx.click(); $('overlay').classList.add('hidden'); onClick(); };
}
function hideOverlay() { $('overlay').classList.add('hidden'); }
function setDir(d) {
  sheep.dir = d;
  document.querySelectorAll('#dpad button').forEach(b => b.classList.toggle('on', b.dataset.dir === d));
}

function respawn() {
  Object.assign(sheep, { row: 0, x: 0, y: 0, z: 0, jumping: false, ride: null, raft: null, carry: 0 });
  setDir('fwd');
  sheepObj.root.rotation.set(0, 0, 0);
  queued = false;
  sheepObj.root.visible = true;
}
function startGame() { lives = CONFIG.lives; score = 0; levelIdx = 0; startLevel(); }
function startLevel() {
  const L = CONFIG.levels[levelIdx];
  buildLevel(levelIdx);
  timeLeft = L.timeLimit; bestRow = 0;
  respawn(); state = 'playing';
  hideOverlay(); updateHUD();
  toast(L.name, `Level ${String(levelIdx + 1).padStart(2, '0')}`, 1800);
  sfx.river();
}

// 转向：只改朝向，不跳
function turn(d) {
  if (state !== 'playing' || sheep.dir === d) return;
  setDir(d); sfx.turn();
}
// 跳跃：朝当前方向跳一格
function jump() {
  if (state !== 'playing') return;
  if (sheep.jumping) {                                   // 快落地时按下，记下来落地后接着跳
    if (sheep.jt > CONFIG.jumpTime * 0.75) queued = true;
    return;
  }
  if (elapsed - lastLand < CONFIG.inputCooldown) return;
  const [dx, dr] = DIRS[sheep.dir];
  const nr = sheep.row + dr;
  if (nr < 0 || nr > goalRow) return;
  let nx = sheep.x + dx;
  if (rows[nr].type === 'land') nx = Math.round(nx);
  if (Math.abs(nx) > LIM() + 0.01) { if (dr === 0) return; nx = clamp(nx, -LIM(), LIM()); }
  sheep.from = { x: sheep.x, z: sheep.z, y: sheep.y };
  sheep.to = { x: nx, z: -nr, row: nr, y: rows[nr].type === 'land' ? 0 : WATER_Y + 0.075 };
  sheep.carry = sheep.ride ? sheep.ride.speed : 0;
  if (sheep.raft) sheep.raft.dipV += 0.25;
  sheep.ride = null; sheep.raft = null; sheep.jumping = true; sheep.jt = 0;
  sfx.jump();
}

function land() {
  sheep.row = sheep.to.row; sheep.x = sheep.to.x; sheep.z = sheep.to.z; sheep.jumping = false;
  lastLand = elapsed;
  const row = rows[sheep.row];
  if (row.type === 'land') {
    sheep.x = clamp(Math.round(sheep.x), -LIM(), LIM());
    sheep.y = 0;
    sfx.grass();
    spray(sheep.x, 0.02, sheep.z, 6, 0x8a7a5c, { size: [0.02, 0.04], up: [0.6, 1.2], spread: 0.8, life: [0.3, 0.5], gravity: 5 });
  } else {
    const raft = row.rafts.find(p => Math.abs(p.x - sheep.x) <= p.len / 2 + CONFIG.landTolerance);
    if (!raft) { fall('扑通', 'Splash'); return; }
    sheep.ride = row; sheep.raft = raft;
    raft.dipV -= 0.9;
    ripple(sheep.x, sheep.z, 0, 1.0);
    sfx.wood();
  }
  if (sheep.row > bestRow) { score += (sheep.row - bestRow) * CONFIG.scorePerRow; bestRow = sheep.row; }
  updateHUD();
  if (sheep.row === goalRow) { levelClear(); return; }
  if (queued) { queued = false; lastLand = -1; jump(); }
}

// 落水 / 被冲走
function fall(msg, sub) {
  if (state !== 'playing') return;
  state = 'sinking'; stateTimer = 0; lives--;
  sheep.jumping = false; sheep.ride = null; sheep.raft = null; queued = false; sheep.sinkFrom = sheep.y;
  spray(sheep.x, WATER_Y, sheep.z, 34, 0xe6f0f2);
  ripple(sheep.x, sheep.z, 0, 1.6); ripple(sheep.x, sheep.z, 0.25, 2.2); ripple(sheep.x, sheep.z, 0.5, 2.8);
  sfx.splash(); toast(msg, sub); updateHUD();
}
function timeUp() {
  state = 'sinking'; stateTimer = 0.6; lives--; queued = false;
  sheepObj.root.visible = false;
  spray(sheep.x, sheep.y + 0.4, sheep.z, 20, 0xf2eee6, { up: [0.5, 1.5], gravity: -0.5, life: [0.6, 1] });
  sfx.fail(); toast('时间到', 'Time up'); updateHUD();
}

function levelClear() {
  state = 'clear'; stateTimer = 0;
  const timeBonus = Math.ceil(timeLeft) * CONFIG.timeBonusPerSec;
  const rowScore = bestRow * CONFIG.scorePerRow;
  score += CONFIG.levelBonus + timeBonus; updateHUD();
  spray(sheep.x, 0.3, sheep.z, 40, 0xffd9a0, { additive: true, up: [0.4, 1.4], spread: 1.2, gravity: -0.6, life: [1.2, 2.2], size: [0.02, 0.04] });
  sfx.chime();
  const last = levelIdx === CONFIG.levels.length - 1;
  setTimeout(() => {
    const stats = `<div class="stats">
      <div><span>前进得分</span><b>${rowScore}</b></div>
      <div><span>过关奖励</span><b>+${CONFIG.levelBonus}</b></div>
      <div><span>剩余时间奖励</span><b>+${timeBonus}</b></div>
      <div class="total"><span>当前总分</span><b>${score}</b></div></div>`;
    if (last) {
      state = 'win';
      showOverlay(`<div class="eyebrow">All levels complete</div><h1>平安到家</h1><div class="divider"></div>
        <p class="sub">小羊穿过了 ${CONFIG.levels.length} 条河，回到了谷仓。</p>${stats}`, '再玩一次', startGame);
    } else {
      showOverlay(`<div class="eyebrow">Level ${String(levelIdx + 1).padStart(2, '0')} complete</div><h1>抵达对岸</h1><div class="divider"></div>
        <p class="sub">下一关：${CONFIG.levels[levelIdx + 1].name}</p>${stats}`, '下一关', () => { levelIdx++; startLevel(); });
    }
  }, 1400);
}
function gameOver() {
  state = 'over';
  sfx.fail();
  showOverlay(`<div class="eyebrow">Game over</div><h1>未能过河</h1><div class="divider"></div>
    <p class="sub">停在了第 ${levelIdx + 1} 关 · ${CONFIG.levels[levelIdx].name}</p>
    <div class="stats"><div class="total"><span>最终得分</span><b>${score}</b></div></div>`, '重新开始', startGame);
}

/* ---------- 每帧更新 ---------- */
function updateWorld(dt) {
  waterMat.uniforms.uTime.value = elapsed;
  rows.forEach(row => {
    if (row.type !== 'water') return;
    row.rafts.forEach(p => {
      p.x = wrap(p.x + row.speed * dt, row.period);
      p.dipV += (-60 * p.dip - 7 * p.dipV) * dt;          // 弹簧：踩上去下沉再浮起
      p.dip += p.dipV * dt;
      const g = p.group;
      g.position.x = p.x;
      g.position.y = WATER_Y + 0.03 + Math.sin(elapsed * 1.6 + p.phase) * 0.012 + p.dip * 0.08;
      g.rotation.z = Math.sin(elapsed * 1.2 + p.phase) * 0.018;
      g.rotation.x = Math.sin(elapsed * 1.7 + p.phase * 2) * 0.014 + p.dip * 0.02;
    });
  });
}

function updateSheep(dt) {
  const S = sheepObj;
  if (state === 'playing') {
    if (sheep.jumping) {
      sheep.jt += dt;
      sheep.from.x += sheep.carry * dt; sheep.to.x += sheep.carry * dt;
      const t = Math.min(1, sheep.jt / CONFIG.jumpTime);
      const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      sheep.x = lerp(sheep.from.x, sheep.to.x, e);
      sheep.z = lerp(sheep.from.z, sheep.to.z, e);
      sheep.y = lerp(sheep.from.y, sheep.to.y, t) + Math.sin(Math.PI * t) * 0.5;
      if (t >= 1) land();
    } else if (sheep.ride) {
      sheep.x += sheep.ride.speed * dt;
      sheep.y = sheep.raft.group.position.y + 0.045;
      if (Math.abs(sheep.x) > CONFIG.riverWidth / 2 + 0.3) fall('被冲走了', 'Swept away');
    }
    if (state === 'playing') {
      timeLeft -= dt;
      if (timeLeft <= 0) { timeLeft = CONFIG.levels[levelIdx].timeLimit; timeUp(); }
    }
  } else if (state === 'sinking') {
    stateTimer += dt;
    if (S.root.visible) {
      sheep.y = sheep.sinkFrom - stateTimer * stateTimer * 2.2;
      S.root.rotation.z = Math.min(0.6, stateTimer);
      if (sheep.y < WATER_Y - 0.9) S.root.visible = false;
    }
    if (stateTimer > 1.4) {
      if (lives <= 0) gameOver();
      else { respawn(); state = 'playing'; updateHUD(); }
    }
  } else if (state === 'clear' || state === 'win') {
    stateTimer += dt;
    sheep.y = Math.abs(Math.sin(stateTimer * 7)) * 0.22;
    if (sheep.dir !== 'back' && stateTimer > 0.6) setDir('back');   // 转身面向镜头
  }

  // 模型姿态
  S.root.position.set(sheep.x, sheep.y, sheep.z);
  const cur = S.root.rotation.y;
  const diff = ((ANGLE[sheep.dir] - cur + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
  S.root.rotation.y = cur + diff * Math.min(1, dt * 14);
  const jt = sheep.jumping ? Math.sin(Math.PI * Math.min(1, sheep.jt / CONFIG.jumpTime)) : 0;
  S.legs.forEach((l, i) => l.rotation.x = (i < 2 ? -1 : 1) * jt * 0.7);
  const breathe = 1 + Math.sin(elapsed * 2.2) * 0.012;
  S.body.scale.set(1 - jt * 0.05, breathe + jt * 0.08, 1 - jt * 0.05);
  S.head.rotation.x = 0.18 + Math.sin(elapsed * 1.3) * 0.04 - jt * 0.15;

  // 脚下阴影
  const rowUnder = rows[clamp(Math.round(-sheep.z), 0, goalRow)];
  let surf = rowUnder && rowUnder.type === 'land' ? 0.006 : WATER_Y + 0.025;
  if (sheep.raft) surf = sheep.raft.group.position.y + 0.05;
  sheepShadow.visible = S.root.visible;
  sheepShadow.position.set(sheep.x, surf, sheep.z);
  const hs = 1 - clamp((sheep.y - surf) * 0.8, 0, 0.5);
  sheepShadow.scale.set(0.75 * hs, 1, 0.95 * hs);

  // 落点指示
  marker.visible = false;
  if (state === 'playing' && !sheep.jumping) {
    const [dx, dr] = DIRS[sheep.dir], nr = sheep.row + dr;
    if (nr >= 0 && nr <= goalRow) {
      let nx = sheep.x + dx;
      if (rows[nr].type === 'land') nx = Math.round(nx);
      if (Math.abs(nx) <= LIM() + 0.01 || dr !== 0) {
        nx = clamp(nx, -LIM() - 0.3, LIM() + 0.3);
        marker.visible = true;
        marker.position.set(nx, rows[nr].type === 'land' ? 0.012 : WATER_Y + 0.05, -nr);
        marker.scale.setScalar(1 + Math.sin(elapsed * 5) * 0.06);
      }
    }
  }
}

/* ---------- 相机：跟随小羊，并根据横竖屏自动调整 ---------- */
let camDist = 12, camElev = deg(38), focusAhead = 3.3;
const camFocus = new THREE.Vector3(0, 0, -2.5);
function resize() {
  const w = window.innerWidth, h = window.innerHeight, portrait = h > w;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = portrait ? 52 : 38;
  camElev = deg(portrait ? 56 : 38);
  focusAhead = portrait ? 4.2 : 3.3;
  const t = Math.tan(deg(camera.fov / 2));
  const distW = (CONFIG.riverWidth / 2 + (portrait ? 0.4 : 0.9)) / (t * camera.aspect);
  camDist = Math.max(distW, portrait ? 11 : 12.5);
  scene.fog.near = camDist + 8; scene.fog.far = camDist + 60;
  camera.updateProjectionMatrix();
}
function updateCamera(dt) {
  const k = 1 - Math.exp(-dt * 3.2);
  camFocus.x += (sheep.x * 0.3 - camFocus.x) * k;
  camFocus.z += (sheep.z - focusAhead - camFocus.z) * k;
  const sway = Math.sin(elapsed * 0.25) * 0.15;
  camera.position.set(camFocus.x + sway, camDist * Math.sin(camElev), camFocus.z + camDist * Math.cos(camElev));
  camera.lookAt(camFocus);
  sky.position.copy(camera.position);
  sunLight.position.copy(camFocus).addScaledVector(sunDir, 30);
  sunLight.target.position.copy(camFocus);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 250));

/* ---------- 输入 ---------- */
// 电脑：WASD / 方向键 只转向，空格跳跃
const TURN_KEYS = { KeyW: 'fwd', ArrowUp: 'fwd', KeyS: 'back', ArrowDown: 'back', KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right' };
window.addEventListener('keydown', e => {
  if (e.code === 'Enter' && !$('overlay').classList.contains('hidden')) { e.preventDefault(); $('ovBtn')?.click(); return; }
  if (e.code === 'Space' || TURN_KEYS[e.code]) {
    e.preventDefault();
    if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
  }
  if (e.code === 'Space') { if (!e.repeat) jump(); return; }
  if (TURN_KEYS[e.code]) turn(TURN_KEYS[e.code]);
});
// 手机：在画面上滑动 = 转向，轻点 = 跳跃
let touchStart = null;
canvas.addEventListener('pointerdown', e => { touchStart = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener('pointerup', e => {
  if (!touchStart) return;
  const dx = e.clientX - touchStart.x, dy = e.clientY - touchStart.y; touchStart = null;
  if (Math.hypot(dx, dy) < 24) { jump(); return; }
  if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 'right' : 'left');
  else turn(dy < 0 ? 'fwd' : 'back');
});
document.querySelectorAll('#dpad button').forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); turn(b.dataset.dir); }));
$('jumpBtn').addEventListener('pointerdown', e => { e.preventDefault(); jump(); });
$('restartBtn').addEventListener('click', () => { $('restartBtn').blur(); sfx.click(); startGame(); });
$('soundBtn').addEventListener('click', () => {
  $('soundBtn').blur(); muted = !muted;
  if (master) master.gain.value = muted ? 0 : 1;
  $('soundWave').style.display = muted ? 'none' : '';
});

/* ---------- 主循环 ---------- */
let last = performance.now(), hudTick = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; elapsed += dt;
  updateWorld(dt);
  updateSheep(dt);
  updateEffects(dt);
  updateCamera(dt);
  if (state === 'playing' && (hudTick += dt) > 0.25) { hudTick = 0; updateHUD(); }
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

/* ---------- 启动 ---------- */
resize();
buildLevel(0);
lives = CONFIG.lives; timeLeft = CONFIG.levels[0].timeLimit; updateHUD();
setTimeout(() => { $('hint').style.opacity = '0'; }, 12000);
showOverlay(`
  <div class="eyebrow">A river crossing game</div>
  <h1>小羊过河</h1>
  <div class="divider"></div>
  <p class="sub">踩着顺流漂移的木筏，把小羊送回对岸的谷仓。<br>落水或被冲出木桩外会失去一条命，共 ${CONFIG.levels.length} 关。</p>
  <div class="keys">
    <span class="deskOnly"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 转向</span>
    <span class="deskOnly"><kbd>Space</kbd> 跳跃</span>
    <span class="touchOnly">滑动 / 方向键 转向</span>
    <span class="touchOnly">轻点画面 / 跳 按钮 跳跃</span>
  </div>`,
  '开始', startGame);
requestAnimationFrame(loop);
</script>
</body>
</html>
